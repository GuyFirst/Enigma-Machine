# Render Blueprint: deploy the backend by connecting this repo at
# https://dashboard.render.com -> New -> Blueprint.
# Fill the sync:false env vars in the Render dashboard (values from Supabase).
services:
  - type: web
    name: enigma-chat-backend
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false # jdbc:postgresql://<supabase-host>:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SUPABASE_JWKS_URI
        sync: false # https://<project-ref>.supabase.co/auth/v1/.well-known/jwks.json
      - key: ALLOWED_ORIGINS
        sync: false # https://<your-app>.vercel.app
      - key: AI_API_KEY
        sync: false # optional - only needed for the legacy /enigma/ai endpoint
