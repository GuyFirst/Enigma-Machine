spring:
  datasource:
    # Embedded H2 in-memory database - no external DB service needed.
    # DB_CLOSE_DELAY=-1 keeps the in-memory DB alive for the lifetime of the JVM
    # instead of dropping it after the first connection closes.
    url: jdbc:h2:mem:enigma;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB

enigma:
  ai:
    api-key: ${AI_API_KEY}
